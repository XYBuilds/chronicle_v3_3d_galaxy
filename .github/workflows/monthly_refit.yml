name: P18.5 Monthly galaxy refit

on:
  schedule:
    - cron: "0 20 1 * *" # 20:00 UTC on the 1st of each month (~04:00 Beijing 2nd)
  workflow_dispatch:
    inputs:
      anchor_mode:
        description: "P18.5b Procrustes anchor gate (see scripts/cron/monthly_refit.py)."
        type: choice
        default: soft
        options:
          - soft
          - hard
          - skip
      force_skip_dim_check:
        type: boolean
        default: false
        description: "P20.2 Skip dimension drift check (emergency unblock only; bump palettes for real fixes)."

permissions:
  contents: read
  deployments: write

concurrency:
  group: p18-5-monthly-refit
  cancel-in-progress: false

jobs:
  refit:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      NUMBA_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      GALAXY_EXPORT_SEQ: ${{ github.run_number }}
      GALAXY_EXPORT_VERSION_BRANCH: monthly
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.cpu.txt

      - name: Restore embedding bundle cache (cleaned.csv + npy)
        id: emb_cache
        uses: actions/cache@v4
        with:
          path: |
            data/output/cleaned.csv
            data/output/text_embeddings.npy
            data/output/genre_vectors.npy
            data/output/language_vectors.npy
          key: ${{ runner.os }}-p18-monthly-emb-${{ hashFiles('requirements.cpu.txt') }}-v1
          restore-keys: |
            ${{ runner.os }}-p18-monthly-emb-

      # Scheme C: canonical bundle from private URL (zip). When set, overwrites cache/repo
      # copies under data/output/. Zip must contain the four files in one directory (any nesting).
      - name: Download embedding bundle (GALAXY_EMBED_BUNDLE_URL)
        env:
          BUNDLE_URL: ${{ secrets.GALAXY_EMBED_BUNDLE_URL }}
        run: |
          set -euo pipefail
          # Secrets pasted with trailing newline/CR or spaces break curl with "(3) Malformed input".
          BUNDLE_URL="$(printf '%s' "${BUNDLE_URL:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$BUNDLE_URL" ]; then
            echo "GALAXY_EMBED_BUNDLE_URL not set; using Actions cache and/or repo copy under data/output/."
            exit 0
          fi
          case "$BUNDLE_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::GALAXY_EMBED_BUNDLE_URL must be a single http(s) URL to a .zip (no quotes or extra lines in the secret)."
              exit 1
              ;;
          esac
          mkdir -p data/output
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fSL "$BUNDLE_URL" -o "$tmp/bundle.zip"
          unzip -q -o "$tmp/bundle.zip" -d "$tmp/extract"
          csv_path="$(find "$tmp/extract" -type f -name cleaned.csv | head -1)"
          if [ -z "$csv_path" ]; then
            echo "::error::Archive from GALAXY_EMBED_BUNDLE_URL must contain cleaned.csv."
            exit 1
          fi
          dir="$(dirname "$csv_path")"
          for f in cleaned.csv text_embeddings.npy genre_vectors.npy language_vectors.npy; do
            if [ ! -f "$dir/$f" ]; then
              echo "::error::Missing $f in same directory as cleaned.csv (dir=$dir)."
              exit 1
            fi
          done
          cp "$dir/cleaned.csv" "$dir/text_embeddings.npy" "$dir/genre_vectors.npy" "$dir/language_vectors.npy" data/output/
          echo "Embedding bundle copied from zip into data/output/ (GALAXY_EMBED_BUNDLE_URL)."

      - name: Verify embedding bundle (cache, repo, or downloaded zip)
        run: |
          set -euo pipefail
          ok=true
          for f in \
            data/output/cleaned.csv \
            data/output/text_embeddings.npy \
            data/output/genre_vectors.npy \
            data/output/language_vectors.npy; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; ok=false; fi
          done
          if [ "$ok" != true ]; then
            echo "::error::Monthly refit requires the embedding bundle under data/output/. Set secret GALAXY_EMBED_BUNDLE_URL (zip URL), restore Actions cache, or commit the four files."
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.cpu.txt

      - name: Monthly refit (threshold + UMAP + Procrustes + Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          MONTHLY_ANCHOR_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.anchor_mode) || 'soft' }}
          MONTHLY_ANCHOR_SOFT_FAIL_MAX: "50"
          DIM_DRIFT_FORCE_SKIP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_skip_dim_check || false }}
        run: |
          set -euo pipefail
          python scripts/cron/monthly_refit.py

      # P18.6b: large gzip → R2; Pages bundle keeps a small manifest only (when secrets are set).
      - name: Upload galaxy gzip to R2 (P18.6b)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_KEY_PREFIX: galaxy
          R2_GALAXY_PRUNE_AFTER_UPLOAD: "1"
        run: |
          set -euo pipefail
          python scripts/cron/upload_galaxy_r2.py

      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-export-monthly-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            monthly_refit_meta.json
            frontend/public/data/galaxy_data.json
            frontend/public/data/galaxy_data.json.gz
            frontend/public/data/galaxy_search_index.json.gz
            frontend/public/data/today.json
            frontend/public/data/og-today.png

      # P18.6: Direct Upload to Cloudflare Pages (independent of P18.5b anchor soft gate once this job reaches here).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install and build frontend (embed cron-exported galaxy_data)
        env:
          VITE_CF_BEACON_TOKEN: ${{ secrets.CF_WEB_ANALYTICS_BEACON_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf node_modules frontend/node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund
          npm run build -w frontend

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ github.token }}

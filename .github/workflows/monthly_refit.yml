name: Monthly Data Release

on:
  schedule:
    - cron: "0 20 1 * *" # 20:00 UTC on day 1; Daily at 18:00 UTC shares the production lock
  workflow_dispatch:
    inputs:
      anchor_mode:
        description: "P18.5b Procrustes anchor gate (see scripts/cron/monthly_refit.py)."
        type: choice
        default: soft
        options:
          - soft
          - hard
          - skip

permissions:
  contents: read
  deployments: write

concurrency:
  group: galaxy-r2-pages-release
  cancel-in-progress: false

jobs:
  refit:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      NUMBA_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      GALAXY_EXPORT_SEQ: ${{ github.run_number }}
      GALAXY_EXPORT_VERSION_BRANCH: monthly
      PRODUCTION_ORIGIN: https://themoviecosmos.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.cpu.txt

      - name: Restore embedding bundle cache (cleaned.csv + npy)
        id: emb_cache
        uses: actions/cache@v4
        with:
          path: |
            data/output/cleaned.csv
            data/output/text_embeddings.npy
            data/output/genre_vectors.npy
            data/output/language_vectors.npy
          key: ${{ runner.os }}-p18-monthly-emb-v3-${{ hashFiles('requirements.cpu.txt') }}
          restore-keys: |
            ${{ runner.os }}-p18-monthly-emb-v3-

      - name: Download embedding bundle (GALAXY_EMBED_BUNDLE_URL)
        env:
          BUNDLE_URL: ${{ secrets.GALAXY_EMBED_BUNDLE_URL }}
        run: |
          set -euo pipefail
          BUNDLE_URL="$(printf '%s' "${BUNDLE_URL:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$BUNDLE_URL" ]; then
            echo "GALAXY_EMBED_BUNDLE_URL not set; using Actions cache and/or repo copy under data/output/."
            exit 0
          fi
          case "$BUNDLE_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::GALAXY_EMBED_BUNDLE_URL must be a single http(s) URL to a .zip (no quotes or extra lines in the secret)."
              exit 1
              ;;
          esac
          mkdir -p data/output
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fSL "$BUNDLE_URL" -o "$tmp/bundle.zip"
          unzip -q -o "$tmp/bundle.zip" -d "$tmp/extract"
          csv_path="$(find "$tmp/extract" -type f -name cleaned.csv | head -1)"
          if [ -z "$csv_path" ]; then
            echo "::error::Archive from GALAXY_EMBED_BUNDLE_URL must contain cleaned.csv."
            exit 1
          fi
          dir="$(dirname "$csv_path")"
          for f in cleaned.csv text_embeddings.npy genre_vectors.npy language_vectors.npy; do
            if [ ! -f "$dir/$f" ]; then
              echo "::error::Missing $f in same directory as cleaned.csv (dir=$dir)."
              exit 1
            fi
          done
          cp "$dir/cleaned.csv" "$dir/text_embeddings.npy" "$dir/genre_vectors.npy" "$dir/language_vectors.npy" data/output/
          echo "Embedding bundle copied from zip into data/output/ (GALAXY_EMBED_BUNDLE_URL)."

      - name: Verify embedding bundle (cache, repo, or downloaded zip)
        run: |
          set -euo pipefail
          ok=true
          for f in \
            data/output/cleaned.csv \
            data/output/text_embeddings.npy \
            data/output/genre_vectors.npy \
            data/output/language_vectors.npy; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; ok=false; fi
          done
          if [ "$ok" != true ]; then
            echo "::error::Monthly Data Release requires the embedding bundle under data/output/. Set secret GALAXY_EMBED_BUNDLE_URL (zip URL), restore Actions cache, or commit the four files."
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.cpu.txt

      - name: Check publication hold
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python scripts/cron/site_artifact_store.py fetch-hold --path /tmp/publication-hold.json
          python scripts/cron/publication_hold.py check --path /tmp/publication-hold.json

      - name: Supabase read-only preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python scripts/cron/check_supabase_health.py

      - name: Galaxy Refit (threshold + UMAP + Procrustes + Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          MONTHLY_ANCHOR_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.anchor_mode) || 'soft' }}
          MONTHLY_ANCHOR_SOFT_FAIL_MAX: "50"
        run: |
          set -euo pipefail
          python scripts/cron/monthly_refit.py

      - name: Sync OG index KV incrementally
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OG_INDEX_KV_NAMESPACE_ID: ${{ secrets.OG_INDEX_KV_NAMESPACE_ID }}
          OG_INDEX_KV_API_TOKEN: ${{ secrets.OG_INDEX_KV_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python scripts/cron/sync_og_index_kv.py --scope incremental

      # P42.4: candidate immutable profile → immutable galaxy/search → local Pages
      # manifest. Pointer activation stays Monthly-only; bootstrap/force remain recovery.
      - name: Publish monthly galaxy and active emission profile to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_KEY_PREFIX: galaxy
          R2_GALAXY_PRUNE_AFTER_UPLOAD: "1"
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          profile="$(python -c "from pathlib import Path; p=sorted(Path('data/output/monthly_profiles').glob('profile-*.json')); assert len(p) == 1, f'expected one generated profile, got {len(p)}'; print(p[0])")"
          python scripts/cron/upload_galaxy_r2.py --mode monthly --profile "$profile" --actor "github:${GITHUB_ACTOR}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galaxy-export-monthly-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            monthly_refit_meta.json
            data/output/monthly_profiles/*.json
            frontend/public/data/galaxy_assets_manifest.json
            frontend/public/data/galaxy_data.json
            frontend/public/data/galaxy_data.json.gz
            frontend/public/data/galaxy_search_index.json.gz

      - name: Compose Pages dist from the active site artifact
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python scripts/cron/site_artifact_store.py fetch-active --output-dir pages-bundle --registry-out /tmp/site-registry.json
          python scripts/cron/pages_compose.py fetch-origin --url "${PRODUCTION_ORIGIN}/data/site-artifact.json" --output /tmp/deployed-sidecar.json
          python scripts/cron/pages_compose.py fetch-origin --url "${PRODUCTION_ORIGIN}/data/galaxy_assets_manifest.json" --output /tmp/previous-manifest.json
          deployed="$(python -c "import json; print(json.load(open('/tmp/deployed-sidecar.json', encoding='utf-8'))['artifact_id'])")"
          active="$(python -c "import json; print(json.load(open('/tmp/site-registry.json', encoding='utf-8'))['active'])")"
          python scripts/cron/pages_compose.py compose \
            --dist-dir pages-bundle/dist \
            --manifest frontend/public/data/galaxy_assets_manifest.json \
            --artifact-id "${active}" \
            --registry /tmp/site-registry.json \
            --deployed-artifact-id "${deployed}"

      - name: Deploy composed Pages dist
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pages-bundle
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ github.token }}

      - name: Production smoke
        run: |
          set -euo pipefail
          data_version="$(python -c "import json; print(json.load(open('frontend/public/data/galaxy_assets_manifest.json', encoding='utf-8'))['data_version'])")"
          python scripts/cron/production_smoke.py --origin "${PRODUCTION_ORIGIN}" --expected-data-version "${data_version}"

      - name: Recompose last-known-good manifest
        if: failure()
        run: |
          set -euo pipefail
          test -f /tmp/previous-manifest.json
          test -d pages-bundle/dist
          active="$(python -c "import json; print(json.load(open('/tmp/site-registry.json', encoding='utf-8'))['active'])")"
          python scripts/cron/pages_compose.py compose \
            --dist-dir pages-bundle/dist \
            --manifest /tmp/previous-manifest.json \
            --artifact-id "${active}" \
            --skip-active-match

      - name: Redeploy last-known-good Pages dist
        if: failure()
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: pages-bundle
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ github.token }}

name: Daily Data Release

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy-r2-pages-release
  cancel-in-progress: false

jobs:
  daily:
    if: >-
      github.repository == 'XYBuilds/chronicle_v3_3d_galaxy' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      vars.PUBLICATION_AUTHORITY == 'github' &&
      (github.event_name == 'workflow_dispatch' || vars.P1_DAILY_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      PUBLICATION_AUTHORITY: ${{ vars.PUBLICATION_AUTHORITY }}
      P1_DAILY_SCHEDULE_ENABLED: ${{ vars.P1_DAILY_SCHEDULE_ENABLED }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      OG_INDEX_KV_API_TOKEN: ${{ secrets.OG_INDEX_KV_API_TOKEN }}
      OG_INDEX_KV_NAMESPACE_ID: ${{ secrets.OG_INDEX_KV_NAMESPACE_ID }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      OMP_NUM_THREADS: '4'
      NUMBA_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GALAXY_EXPORT_FETCH_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install publication dependencies
        run: python -m pip install -r requirements.cpu.txt
      - name: Run shared Daily Data Release entry point
        shell: bash
        run: |
          set -euo pipefail
          trigger=manual
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then trigger=schedule; fi
          python scripts/publication/cli.py daily-release \
            --mode production --ref "$GITHUB_REF_NAME" --protected \
            --pipeline-source "$GITHUB_EVENT_NAME" --trigger "$trigger" \
            --source-commit "$GITHUB_SHA" --actor "$GITHUB_ACTOR" \
            --pages-project "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --pipeline-id "$GITHUB_RUN_ID" --job-id "$GITHUB_JOB/$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee publication.log
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication.log
            frontend/public/data/galaxy_assets_manifest.json
          if-no-files-found: ignore
          retention-days: 14

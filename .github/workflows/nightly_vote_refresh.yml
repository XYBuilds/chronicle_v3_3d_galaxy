name: P18.4 Nightly vote refresh

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC daily (~04:00 Beijing next day)
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: p18-4-nightly-vote-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      NUMBA_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      GALAXY_EXPORT_SEQ: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.cpu.txt

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.cpu.txt

      - name: Run nightly vote refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          python scripts/cron/nightly_vote_refresh.py

      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-export-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            frontend/public/data/galaxy_data.json
            frontend/public/data/galaxy_data.json.gz
            frontend/public/data/galaxy_search_index.json.gz

      # P18.6: Direct Upload to Cloudflare Pages (GitHub Pages workflow remains for gray release).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upgrade npm (Linux optional native deps)
        run: npm i -g npm@10.8.3

      - name: Install and build frontend (embed cron-exported galaxy_data)
        run: |
          set -euo pipefail
          rm -rf node_modules frontend/node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund
          npm run build -w frontend

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1.5.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          directory: frontend/dist
          wranglerVersion: "3"
          gitHubToken: ${{ github.token }}

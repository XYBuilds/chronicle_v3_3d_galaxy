name: P18.4 Nightly vote refresh

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC daily (~04:00 Beijing next day)
  workflow_dispatch:
    inputs:
      force_skip_dim_check:
        type: boolean
        default: false
        description: "P20.2 Skip dimension drift check (emergency unblock only; bump palettes for real fixes)."

permissions:
  contents: read
  deployments: write

concurrency:
  group: p18-4-nightly-vote-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      NUMBA_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      GALAXY_EXPORT_SEQ: ${{ github.run_number }}
      # Lower parallel Supabase reads to avoid statement_timeout (57014); export retries + sequential fallback in code.
      GALAXY_EXPORT_FETCH_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.cpu.txt

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.cpu.txt

      - name: Supabase read-only preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python scripts/cron/check_supabase_health.py

      - name: Run nightly vote refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          DIM_DRIFT_FORCE_SKIP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_skip_dim_check || false }}
          # P34.3: OG index KV sync (daily: meta:G + today); skip if any unset
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OG_INDEX_KV_NAMESPACE_ID: ${{ secrets.OG_INDEX_KV_NAMESPACE_ID }}
          OG_INDEX_KV_API_TOKEN: ${{ secrets.OG_INDEX_KV_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/cron/nightly_vote_refresh.py

      # P18.6b: large gzip → R2; Pages bundle keeps a small manifest only (when secrets are set).
      - name: Upload galaxy gzip to R2 (P18.6b)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_KEY_PREFIX: galaxy
          R2_GALAXY_PRUNE_AFTER_UPLOAD: "1"
        run: |
          set -euo pipefail
          python scripts/cron/upload_galaxy_r2.py

      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-export-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            frontend/public/data/galaxy_data.json
            frontend/public/data/galaxy_data.json.gz
            frontend/public/data/galaxy_search_index.json.gz
            frontend/public/data/today.json

      # P18.6: Direct Upload to Cloudflare Pages (GitHub Pages workflow remains for gray release).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install and build frontend (embed cron-exported galaxy_data)
        env:
          VITE_CF_BEACON_TOKEN: ${{ secrets.CF_WEB_ANALYTICS_BEACON_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf node_modules frontend/node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund
          npm run build -w frontend

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # CWD=frontend so ./functions → frontend/functions (Pages middleware) and dist → frontend/dist
          workingDirectory: frontend
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ github.token }}

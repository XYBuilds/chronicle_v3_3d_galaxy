name: Site Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy-r2-pages-release
  cancel-in-progress: false

jobs:
  site:
    if: >-
      github.repository == 'XYBuilds/chronicle_v3_3d_galaxy' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      vars.PUBLICATION_AUTHORITY == 'github' &&
      (github.event_name == 'workflow_dispatch' || vars.P1_SITE_TRIGGER_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      PUBLICATION_AUTHORITY: ${{ vars.PUBLICATION_AUTHORITY }}
      P1_SITE_TRIGGER_ENABLED: ${{ vars.P1_SITE_TRIGGER_ENABLED }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SITE_RELEASE_SHELL: '1'
      VITE_CF_BEACON_TOKEN: ${{ secrets.CF_WEB_ANALYTICS_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install publication dependencies
        run: python -m pip install "boto3>=1.34,<2"
      - name: Run shared Site Release entry point
        shell: bash
        run: |
          set -euo pipefail
          trigger=manual
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then trigger=schedule; fi
          python scripts/publication/cli.py site-release \
            --mode production --ref "$GITHUB_REF_NAME" --protected \
            --pipeline-source "$GITHUB_EVENT_NAME" --trigger "$trigger" \
            --source-commit "$GITHUB_SHA" --actor "$GITHUB_ACTOR" \
            --pages-project "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --pipeline-id "$GITHUB_RUN_ID" --job-id "$GITHUB_JOB/$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee publication.log
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication.log
            frontend/public/data/galaxy_assets_manifest.json
          if-no-files-found: ignore
          retention-days: 14

name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Linux workspace dependencies
        run: |
          rm -rf node_modules frontend/node_modules package-lock.json
          npm install --include=optional --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
  publication-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest httpx boto3 python-dotenv pyyaml
      - run: >-
          python -m pytest scripts/tests/test_current_documentation_authority.py
          scripts/tests/test_chronicle_p0_restore.py scripts/tests/test_p0_common_protection.py
          scripts/tests/test_p1_publication_control.py scripts/tests/test_p2_monthly_recovery.py
          scripts/tests/test_production_recovery.py scripts/tests/test_publication_hold.py
          scripts/tests/test_release_primitives_contract.py scripts/tests/test_og_pipeline_phase34.py
          scripts/tests/test_github_cutback.py
      - run: git diff --check

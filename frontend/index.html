<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#837D8C" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>the movie cosmos</title>
  <meta
    name="description"
    content="The Movie Cosmos renders ~60,000 TMDB films as an explorable 2.5D particle galaxy."
  />

  <!-- P34: apex `/` static meta; `/movie/*` and `/today` overridden by OG Worker HTML injection. -->
  <meta property="og:title" content="The Movie Cosmos" />
  <meta
    property="og:description"
    content="A 2.5D galaxy of ~60,000 films from TMDB. Explore release history as depth in The Movie Cosmos."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://themoviecosmos.com/" />
  <meta property="og:image" content="https://themoviecosmos.com/og/brand.png?v=og-brand-og-v1" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt" content="The Movie Cosmos" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Movie Cosmos" />
  <meta
    name="twitter:description"
    content="A 2.5D galaxy of ~60,000 films from TMDB. Explore release history as depth in The Movie Cosmos."
  />
  <meta name="twitter:image" content="https://themoviecosmos.com/og/brand.png?v=og-brand-og-v1" />
</head>

<body>
  <div id="root"></div>
  <!-- P34.7: TMDB API Terms §3 — visible before SPA hydrates -->
  <footer
    id="tmdb-attribution-static"
    style="position:fixed;z-index:1;right:12px;bottom:12px;max-width:24rem;margin:0;padding:0;font:12px/1.4 system-ui,sans-serif;color:#aaaab0;text-align:right"
  >
    <a href="https://www.themoviedb.org/" rel="noopener noreferrer" target="_blank">
      <img src="/assets/tmdb-logo-short.svg" alt="TMDB" width="72" height="32" decoding="async" />
    </a>
    <p style="margin:6px 0 0;line-height:1.4;text-wrap:pretty">
      This website uses TMDB and the TMDB APIs but is not endorsed, certified, or otherwise approved by TMDB.
    </p>
    <p style="margin:4px 0 0;font-size:11px">
      <a href="https://www.themoviedb.org/about/logos-attribution" rel="noopener noreferrer" target="_blank" style="color:inherit;text-decoration:underline">Logos &amp; attribution</a>
    </p>
  </footer>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

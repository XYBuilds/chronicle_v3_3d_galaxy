<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>the movie cosmos</title>
  <meta
    name="description"
    content="The Movie Cosmos renders ~60,000 TMDB films as an explorable 2.5D particle galaxy."
  />

  <!-- P23.5 Open Graph / Twitter card. Today's pick refreshes every UTC midnight via nightly cron. -->
  <!-- og:image hostname will switch to the custom domain in P23.6; keep absolute URLs in the meantime. -->
  <meta property="og:title" content="The Movie Cosmos" />
  <meta
    property="og:description"
    content="A 2.5D galaxy of ~60,000 films from TMDB. Today's pick refreshes every UTC midnight."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://the-movie-cosmos.pages.dev/" />
  <meta property="og:image" content="https://the-movie-cosmos.pages.dev/data/og-today.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt" content="Today's pick from The Movie Cosmos" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Movie Cosmos" />
  <meta
    name="twitter:description"
    content="A 2.5D galaxy of ~60,000 films from TMDB. Today's pick refreshes every UTC midnight."
  />
  <meta name="twitter:image" content="https://the-movie-cosmos.pages.dev/data/og-today.png" />
</head>
